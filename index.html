<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Workout</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#182337;background:#f3f6fa}body{max-width:740px;margin:auto;padding:18px}h1{font-size:1.75rem}h2{font-size:1.3rem}.muted{color:#576577}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 2px 8px #16243b12}.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid #e8edf2}.item:first-of-type{border:0}.name{font-weight:650}.detail{font-size:.9rem;color:#596777;margin-top:5px}button{background:#18796f;color:white;border:0;border-radius:12px;padding:12px 16px;font-size:1rem;font-weight:650;white-space:nowrap}button:focus-visible{outline:3px solid #8ddbd1}#status{font-size:.9rem;color:#586777}.notice{border-left:4px solid #c98a22;padding:10px 14px;background:#fff7e8;border-radius:8px}.check{width:22px;height:22px;flex-shrink:0} .left{display:flex;gap:10px;align-items:center}a{color:#136b9e}
.item{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:start;padding:17px 0}.left{align-items:start}.art{width:120px;height:132px;border-radius:12px;background:#eaf4f1;display:flex;align-items:center;justify-content:center;overflow:hidden}.art svg{width:115px;height:125px}.illustration{font-size:38px}.instructions{font-size:.88rem;line-height:1.45;color:#405267;margin-top:7px}.demo{font-size:.85rem;display:inline-block;margin-top:8px}.tip{color:#566879;font-size:.85rem;line-height:1.5}.item button{align-self:center}.check{accent-color:#18796f}@media(max-width:580px){.item{grid-template-columns:96px minmax(0,1fr)}.art{width:96px;height:108px}.art svg{width:92px;height:104px}.item button{grid-column:2;justify-self:start}.left{gap:8px}} .art img{display:block;width:100%;height:100%;object-fit:cover}.item:has(.check:checked) .name{text-decoration:line-through;opacity:.6}.card h2{margin-bottom:14px}.item .left{min-width:0}.instructions{margin-top:9px}.next-exercise{grid-column:2 / -1;justify-self:stretch;background:#215a80;padding:13px 16px;margin-top:3px}.next-exercise:disabled{opacity:.6}.item{scroll-margin-top:18px}@media(max-width:580px){.next-exercise{grid-column:2;justify-self:stretch}} </style></head>
<body><h1>🏃 Daily Workout</h1><p class="muted" id="status">Loading latest workout…</p><p class="notice" id="notice">This page is public. Avoid putting medical details here.</p><main id="workout"></main>
<p class="muted">Timer buttons start your iPhone Clock timer through the Workout Timer Shortcut. iOS/Edge may ask permission each time.</p>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guidance={"warm-up walk":["🚶","Begin at a comfortable pace and gradually increase speed. Keep shoulders relaxed."],"jog (repeat 5 times)":["🏃","Use a relaxed stride and steady breathing. Keep the effort manageable."],"recovery walk (repeat 5 times)":["🚶","Walk briskly until your breathing settles before the next jogging interval."],"cool-down walk":["🚶","Ease the pace down gradually, then finish with easy walking."],"dumbbell floor press":["press","Lie on your back with knees bent. Start with elbows gently touching the floor, press weights over your chest, then lower slowly."],"supported dumbbell row":["row","Support one hand on the bench, keep your back neutral, and pull the dumbbell toward your hip without twisting."],"lateral raises":["raise","Keep a slight bend in your elbows. Lift to shoulder height without shrugging, then lower under control."],"pallof press":["pallof","Stand sideways to the resistance band anchor. Press your hands forward and resist twisting."],"forearm plank":["plank","Keep elbows below shoulders and your torso in a straight line. Stop if you feel groin or back discomfort."],"rest between exercises":["⏱️","Recover for 45–60 seconds between exercises. Rest 75–90 seconds between strength rounds."],"weight shifts":["shift","With soft knees, gently move your weight from one foot to the other."],"arm raises":["arms","Raise your arms slowly with relaxed shoulders and lower smoothly."],"small side steps":["steps","Take controlled, comfortable side steps while staying upright."],"cloud hands":["cloud","Move your hands in a slow, flowing pattern as your weight shifts gently side to side."],"standing breathing":["breathe","Stand tall with relaxed shoulders and breathe slowly and naturally."]};const demos={"pallof press":"https://www.physitrack.com/exercise-library/how-to-perform-the-pallof-press-exercise","cloud hands":"https://www.cleartaichi.com/tai-chi-form/cloud-hands-3684.html"};function drawing(kind){const L=(a,b,c,d)=>'<line x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'" stroke="#244b56" stroke-width="5" stroke-linecap="round"/>';const head='<circle cx="48" cy="17" r="8" fill="#d6b79e" stroke="#244b56" stroke-width="2"/>';const weight=(x,y)=>'<rect x="'+(x-8)+'" y="'+(y-4)+'" width="16" height="8" rx="2" fill="#158a7b"/>';let s='';if(kind==='press'){s='<rect x="6" y="72" width="87" height="5" fill="#93aeb0"/><circle cx="20" cy="61" r="8" fill="#d6b79e"/>'+L(28,61,70,61)+L(70,61,83,72)+L(43,61,43,26)+L(60,61,60,26)+weight(43,24)+weight(60,24)}else if(kind==='row'){s=head+L(48,27,69,48)+L(69,48,80,77)+L(69,48,45,77)+L(54,32,27,52)+L(64,42,84,43)+weight(84,43)+'<rect x="8" y="55" width="38" height="5" fill="#93aeb0"/>'}else if(kind==='plank'){s='<rect x="5" y="78" width="91" height="4" fill="#93aeb0"/><circle cx="19" cy="58" r="7" fill="#d6b79e"/>'+L(26,60,69,52)+L(69,52,89,75)+L(29,62,25,76)}else{s=head+L(48,27,48,55)+L(48,55,31,78)+L(48,55,66,78);if(kind==='raise'){s+=L(48,35,16,35)+L(48,35,80,35)+weight(16,35)+weight(80,35)}else if(kind==='arms'){s+=L(48,35,24,7)+L(48,35,72,7)}else if(kind==='pallof'){s+=L(48,35,79,42)+L(48,42,79,42)+'<path d="M79 42H97" stroke="#158a7b" stroke-width="3" stroke-dasharray="4 3"/>'}else if(kind==='cloud'){s+=L(48,35,22,45)+L(48,35,75,25)+'<path d="M10 50 Q48 5 89 48" fill="none" stroke="#158a7b" stroke-width="2" stroke-dasharray="4 4"/>'}else{s+=L(48,35,27,49)+L(48,35,69,49)}}return '<svg viewBox="0 0 100 85" role="img" aria-label="Simplified movement illustration">'+s+'</svg>'}
const time=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
async function load(){try{const r=await fetch('./workout.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.querySelector('#status').textContent='Workout dated '+d.date+' · '+(d.sections?.[1]?.items?.length||0)+' strength steps';document.querySelector('#notice').textContent=d.note||'';const main=document.querySelector('#workout');const saved=JSON.parse(localStorage.getItem('workout-checks-'+d.date)||'{}');main.replaceChildren();for(const [sectionIndex,section] of d.sections.entries()){const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=section.title;card.append(h);if(section.title==='Strength and core'){const tip=document.createElement('p');tip.className='tip';tip.textContent='Complete one set of each exercise per round. Rest 45–60 seconds between exercises and 75–90 seconds between rounds.';card.append(tip)}if(section.title==='Tai Chi'){const tip=document.createElement('p');tip.className='tip';tip.textContent='Two gentle rounds of five movements, about 10 minutes total.';card.append(tip)}for(const [itemIndex,item] of section.items.entries()){const row=document.createElement('div');row.className='item';const left=document.createElement('label');left.className='left';const check=document.createElement('input');check.type='checkbox';check.className='check';const checkKey=sectionIndex+'-'+itemIndex;check.checked=!!saved[checkKey];check.onchange=()=>{saved[checkKey]=check.checked;localStorage.setItem('workout-checks-'+d.date,JSON.stringify(saved))};const body=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=item.name;const detail=document.createElement('div');detail.className='detail';detail.textContent=item.detail||'';body.append(name,detail);const info=guidance[item.name.toLowerCase()];const instruction=document.createElement('div');instruction.className='instructions';instruction.textContent=item.instructions||info?.[1]||'Use a controlled, comfortable range of motion.';body.append(instruction);const demo=item.demo||demos[item.name.toLowerCase()];if(demo){const link=document.createElement('a');link.className='demo';link.href=demo;link.target='_blank';link.rel='noopener noreferrer';link.textContent='View movement demonstration ↗';body.append(link)}left.append(check,body);const art=document.createElement('div');art.className='art';const kind=info?.[0]||'🏋️';if(item.image){const photo=document.createElement('img');photo.src=item.image;photo.alt=item.name+' exercise demonstration';photo.loading='lazy';photo.onerror=()=>{art.replaceChildren();art.innerHTML=drawing(kind)};art.append(photo)}else if(['press','row','raise','pallof','plank','shift','arms','steps','cloud','breathe'].includes(kind)){art.innerHTML=drawing(kind)}else{const symbol=document.createElement('span');symbol.className='illustration';symbol.textContent=kind;art.append(symbol)}row.append(art,left);if(item.seconds){const b=document.createElement('button');b.textContent='▶ '+time(item.seconds);b.onclick=()=>{location.href='shortcuts://run-shortcut?name=Workout%20Timer&input=text&text='+encodeURIComponent(item.seconds)};row.append(b)}const next=document.createElement('button');next.className='next-exercise';next.textContent='✓ Done · Next ↓';next.setAttribute('aria-label','Mark '+item.name+' complete and scroll to next exercise');next.onclick=()=>{check.checked=true;saved[checkKey]=true;localStorage.setItem('workout-checks-'+d.date,JSON.stringify(saved));const following=row.nextElementSibling||card.nextElementSibling?.querySelector('.item');if(following){following.scrollIntoView({behavior:'smooth',block:'start'});}else{next.textContent='✓ Workout complete';next.disabled=true;}};row.append(next);card.append(row)}main.append(card)}}catch(e){document.querySelector('#status').textContent='Unable to load workout: '+e.message}}
load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('pageshow',()=>load());window.addEventListener('focus',()=>load());
</script></body></html>
