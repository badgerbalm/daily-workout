<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Workout</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#182337;background:#f3f6fa}body{max-width:740px;margin:auto;padding:18px}h1{font-size:1.75rem}h2{font-size:1.3rem}.muted{color:#576577}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 2px 8px #16243b12}.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid #e8edf2}.item:first-of-type{border:0}.name{font-weight:650}.detail{font-size:.9rem;color:#596777;margin-top:5px}button{background:#18796f;color:white;border:0;border-radius:12px;padding:12px 16px;font-size:1rem;font-weight:650;white-space:nowrap}button:focus-visible{outline:3px solid #8ddbd1}#status{font-size:.9rem;color:#586777}.notice{border-left:4px solid #c98a22;padding:10px 14px;background:#fff7e8;border-radius:8px}.check{width:22px;height:22px;flex-shrink:0} .left{display:flex;gap:10px;align-items:center}a{color:#136b9e}</style></head>
<body><h1>🏃 Daily Workout</h1><p class="muted" id="status">Loading latest workout…</p><p class="notice" id="notice">This page is public. Avoid putting medical details here.</p><main id="workout"></main>
<p class="muted">Timer buttons start your iPhone Clock timer through the Workout Timer Shortcut. iOS/Edge may ask permission each time.</p>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
async function load(){try{const r=await fetch('./workout.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.querySelector('#status').textContent='Workout dated '+d.date;document.querySelector('#notice').textContent=d.note||'';const main=document.querySelector('#workout');main.replaceChildren();for(const section of d.sections){const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=section.title;card.append(h);for(const item of section.items){const row=document.createElement('div');row.className='item';const left=document.createElement('label');left.className='left';const check=document.createElement('input');check.type='checkbox';check.className='check';const body=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=item.name;const detail=document.createElement('div');detail.className='detail';detail.textContent=item.detail||'';body.append(name,detail);left.append(check,body);row.append(left);if(item.seconds){const b=document.createElement('button');b.textContent='▶ '+time(item.seconds);b.onclick=()=>{location.href='shortcuts://run-shortcut?name=Workout%20Timer&input=text&text='+encodeURIComponent(item.seconds)};row.append(b)}card.append(row)}main.append(card)}}catch(e){document.querySelector('#status').textContent='Unable to load workout: '+e.message}}
load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
